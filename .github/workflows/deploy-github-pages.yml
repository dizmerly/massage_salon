name: Deploy GitHub Pages

on:
  push:
    branches: [github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build
        env:
          GITHUB_PAGES: 'true'
      - name: Create clean page URLs
        run: |
          # Vinext writes prefixed framework assets under massage_salon/_next,
          # while GitHub Pages already serves the artifact at /massage_salon.
          mv dist/client/massage_salon/_next dist/client/_next
          rmdir dist/client/massage_salon
          mkdir -p dist/client/booking dist/client/salon
          cp dist/client/booking.html dist/client/booking/index.html
          cp dist/client/booking.rsc dist/client/booking/index.rsc
          cp dist/client/salon.html dist/client/salon/index.html
          cp dist/client/salon.rsc dist/client/salon/index.rsc
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
